        function applyLogFilters() {
            logFilters.url = document.getElementById('filterLogUrl').value;
            logFilters.mock_url = document.getElementById('filterLogMockUrl').value;
            logPage = 1;
            loadLogs();
        }
        
        function resetLogFilters() {
            document.getElementById('filterLogUrl').value = '';
            document.getElementById('filterLogMockUrl').value = '';
            document.getElementById('filterLogDateStart').value = '';
            document.getElementById('filterLogDateEnd').value = '';
            logFilters = { url: '', mock_url: '', date_start: '', date_end: '' };
            updateFilterClearBtn();
            logPage = 1;
            loadLogs();
        }
        
        function clearFilter(id) {
            const input = document.getElementById(id);
            input.value = '';
            updateFilterClearBtn();
            
            if (id === 'filterName' || id === 'filterMethod' || id === 'filterUrl') {
                if (id === 'filterName') filters.name = '';
                if (id === 'filterMethod') filters.method = '';
                if (id === 'filterUrl') filters.url = '';
                loadConfigs();
            } else if (id === 'filterLogUrl' || id === 'filterLogMockUrl') {
                if (id === 'filterLogUrl') logFilters.url = '';
                if (id === 'filterLogMockUrl') logFilters.mock_url = '';
                loadLogs();
            }
        }
        
        function updateFilterClearBtn() {
            ['filterName', 'filterUrl', 'filterLogUrl', 'filterLogMockUrl'].forEach(id => {
                const input = document.getElementById(id);
                const btn = input.nextElementSibling;
                if (input && btn && btn.classList.contains('filter-clear-btn')) {
                    btn.classList.toggle('show', input.value.length > 0);
                }
            });
        }
        
        // ==================== Toast ====================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
        
        // ==================== 日期选择器 ====================
        function openDatePicker(mode, evt) {
            datePickerMode = mode;
            const current = (mode === 'config') ? filters : logFilters;
            datePickerStart = current.date_start || null;
            datePickerEnd = current.date_end || null;
            
            const now = new Date();
            datePickerStartYear = now.getFullYear();
            datePickerStartMonth = now.getMonth();
            datePickerEndYear = datePickerStartYear;
            datePickerEndMonth = datePickerStartMonth + 1;
            if (datePickerEndMonth > 11) {
                datePickerEndMonth = 0;
                datePickerEndYear++;
            }
            
            renderDatePicker();
            document.getElementById('datePickerModal').classList.add('show');
            if (evt && evt.currentTarget) {
                positionDatePicker(evt.currentTarget);
            }
        }
        
        function positionDatePicker(anchor) {
            const container = document.querySelector('#datePickerModal .date-picker-container');
            const rect = anchor.getBoundingClientRect();
            const gap = 4;
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;
            
            let left = rect.left;
            if (left + containerWidth > window.innerWidth) {
                left = rect.right - containerWidth;
            }
            if (left < 8) left = 8;
            
            let top = rect.bottom + gap;
            if (top + containerHeight > window.innerHeight) {
                top = rect.top - containerHeight - gap;
            }
            if (top < 8) top = 8;
            
            container.style.left = left + 'px';
            container.style.top = top + 'px';
        }
        
        function closeDatePicker() {
            document.getElementById('datePickerModal').classList.remove('show');
        }
        
        function renderDatePicker() {
            renderMonth('datePickerStartGrid', 'datePickerStartTitle', datePickerStartYear, datePickerStartMonth);
            renderMonth('datePickerEndGrid', 'datePickerEndTitle', datePickerEndYear, datePickerEndMonth);
        }
        
        function renderMonth(gridId, titleId, year, month) {
            const title = document.getElementById(titleId);
            title.textContent = `${year}年${month + 1}月`;
            
            const grid = document.getElementById(gridId);
            let html = '';
            
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            weekDays.forEach(day => {
                html += `<div class="date-picker-week">${day}</div>`;
            });
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const dateStr = getDateStr(year, month - 1, day);
                html += `<div class="date-picker-day other-month" data-date="${dateStr}" onclick="selectDate('${dateStr}')">${day}</div>`;
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = getDateStr(year, month, day);
                let classes = 'date-picker-day';
                
                if (dateStr === todayStr) classes += ' today';
                if (datePickerStart === dateStr) classes += ' selected';
                if (datePickerEnd === dateStr) classes += ' selected';
                if (datePickerStart && datePickerEnd && dateStr > datePickerStart && dateStr < datePickerEnd) classes += ' in-range';
                
                html += `<div class="${classes}" data-date="${dateStr}" onclick="selectDate('${dateStr}')">${day}</div>`;
            }
            
            const totalDays = firstDay + daysInMonth;
            const remainingDays = 42 - totalDays;
            for (let day = 1; day <= remainingDays; day++) {
                const dateStr = getDateStr(year, month + 1, day);
                html += `<div class="date-picker-day other-month" data-date="${dateStr}" onclick="selectDate('${dateStr}')">${day}</div>`;
            }
            
            grid.innerHTML = html;
        }
        
        function getDateStr(year, month, day) {
            if (month < 0) {
                year--;
                month = 11;
            }
            if (month > 11) {
                year++;
                month = 0;
            }
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }
        
        function datePickerPrevMonth(panel) {
            if (panel === 'start') {
                datePickerStartMonth--;
                if (datePickerStartMonth < 0) {
                    datePickerStartMonth = 11;
                    datePickerStartYear--;
                }
            } else {
                datePickerEndMonth--;
                if (datePickerEndMonth < 0) {
                    datePickerEndMonth = 11;
                    datePickerEndYear--;
                }
            }
            renderDatePicker();
        }
        
        function datePickerNextMonth(panel) {
            if (panel === 'start') {
                datePickerStartMonth++;
                if (datePickerStartMonth > 11) {
                    datePickerStartMonth = 0;
                    datePickerStartYear++;
                }
            } else {
                datePickerEndMonth++;
                if (datePickerEndMonth > 11) {
                    datePickerEndMonth = 0;
                    datePickerEndYear++;
                }
            }
            renderDatePicker();
        }
        
        function selectDate(dateStr) {
            if (!datePickerStart || (datePickerStart && datePickerEnd)) {
                datePickerStart = dateStr;
                datePickerEnd = null;
            } else {
                if (dateStr < datePickerStart) {
                    datePickerEnd = datePickerStart;
                    datePickerStart = dateStr;
                } else {
                    datePickerEnd = dateStr;
                }
                confirmDatePicker();
                return;
            }
            renderDatePicker();
        }
        
        function confirmDatePicker() {
            if (datePickerStart && datePickerEnd) {
                if (datePickerMode === 'config') {
                    filters.date_start = datePickerStart;
                    filters.date_end = datePickerEnd;
                    document.getElementById('configDateRangeText').textContent = `${datePickerStart} ~ ${datePickerEnd}`;
                } else {
                    logFilters.date_start = datePickerStart;
                    logFilters.date_end = datePickerEnd;
                    document.getElementById('logDateRangeText').textContent = `${datePickerStart} ~ ${datePickerEnd}`;
                }
            } else if (datePickerStart) {
                if (datePickerMode === 'config') {
                    filters.date_start = datePickerStart;
                    filters.date_end = datePickerStart;
                    document.getElementById('configDateRangeText').textContent = datePickerStart;
                } else {
                    logFilters.date_start = datePickerStart;
                    logFilters.date_end = datePickerStart;
                    document.getElementById('logDateRangeText').textContent = datePickerStart;
                }
            }
            closeDatePicker();
        }
        
        // 修改重置过滤器函数，清空日期显示
        function resetFilters() {
            document.getElementById('filterName').value = '';
            document.getElementById('filterMethod').value = '';
            document.getElementById('filterUrl').value = '';
            filters = { name: '', method: '', url: '', date_start: '', date_end: '' };
            document.getElementById('configDateRangeText').textContent = '选择日期范围';
            updateFilterClearBtn();
            configPage = 1;
            loadConfigs();
        }
        
        function resetLogFilters() {
            document.getElementById('filterLogUrl').value = '';
            document.getElementById('filterLogMockUrl').value = '';
            logFilters = { url: '', mock_url: '', date_start: '', date_end: '' };
            document.getElementById('logDateRangeText').textContent = '选择日期范围';
            updateFilterClearBtn();
            logPage = 1;
            loadLogs();
        }
    </script>
