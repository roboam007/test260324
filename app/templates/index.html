<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 HTTP Mock Server - 管理界面</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; min-height: 100vh; }
        
        /* 主布局 */
        .app-container { display: flex; height: 100vh; overflow: hidden; }
        
        /* 左侧侧边栏 - 简洁版 */
        .sidebar {
            width: 200px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            background: #333;
            color: white;
            padding: 10px 15px;
            text-align: left;
        }
        .sidebar-header h2 { font-size: 1rem; margin-bottom: 3px; }
        .sidebar-header p { font-size: 0.75rem; opacity: 0.8; }
        
        /* 目录树 - 极简风格 */
        .tree-container { flex: 1; overflow-y: auto; padding: 8px 5px; }
        .tree-item {
            cursor: pointer;
            padding: 3px 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #333;
            line-height: 1.4;
            position: relative;
        }
        .tree-item:hover { color: #409eff; }
        .tree-item.active { color: #409eff; font-weight: 500; }
        .tree-item .name { flex: 1; }
        .tree-children { margin-left: 10px; display: none; }
        .tree-children.show { display: block; }
        .tree-expand {
            width: 12px;
            text-align: center;
            font-size: 9px;
            color: #999;
        }
        .tree-expand.expanded { transform: rotate(90deg); }
        .tree-menu {
            color: #999;
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }
        .tree-menu:hover { color: #409eff; }
        
        /* 三点菜单 */
        .tree-menu-dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            background: white;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            width: 100px;
            display: none;
        }
        .tree-menu-dropdown.show { display: block; }
        .tree-menu-item {
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            color: #333;
            text-align: center;
        }
        .tree-menu-item:hover { background: #f5f7fa; color: #409eff; }
        
        /* 右侧内容区 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }
        
        /* Tab导航 - 简洁版 */
        .tab-nav {
            display: flex;
            background: white;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .tab-btn:hover { color: #409eff; }
        .tab-btn.active {
            color: #409eff;
            border-bottom-color: #409eff;
        }
        
        /* 卡片样式 - 简洁版 */
        .card {
            background: white;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
            min-height: 32px;
        }
        .card-header h2 { color: #333; font-size: 1.1rem; margin: 0; line-height: 32px; }
        .card-header .btn { height: 32px; line-height: 32px; padding: 0 16px; }
        
        /* 按钮样式 - 简洁版 */
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-primary { background: #409eff; color: white; }
        .btn-primary:hover { background: #66b1ff; }
        .btn-danger { background: #f56c6c; color: white; }
        .btn-danger:hover { background: #f78989; }
        .btn-success { background: #67c23a; color: white; }
        .btn-success:hover { background: #85ce61; }
        .btn-secondary { background: #909399; color: white; }
        .btn-secondary:hover { background: #a6a9ad; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        
        /* 表单样式 - 简洁版 */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; color: #666; font-size: 13px; }
        .form-group .required { color: #f56c6c; margin-left: 3px; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; 
            padding: 8px 10px; 
            border: 1px solid #dcdfe6; 
            border-radius: 4px; 
            font-size: 13px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #409eff;
        }
        .form-group textarea { min-height: 100px; font-family: monospace; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
        
        /* 目录下拉组件 */
        .group-select { position: relative; }
        .group-select-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 32px;
            padding: 0 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            background: white;
            box-sizing: border-box;
        }
        .group-select-display:hover { border-color: #409eff; }
        .group-select-arrow { color: #999; font-size: 12px; }
        .group-select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            max-height: 240px;
            overflow-y: auto;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            z-index: 100;
            display: none;
            box-sizing: border-box;
        }
        .group-select-dropdown.show { display: block; }
        .group-opt-row {
            display: flex;
            align-items: center;
            height: 30px;
            cursor: pointer;
            font-size: 13px;
            padding-right: 8px;
        }
        .group-opt-row:hover { background: #f5f7fa; }
        .group-opt-row.selected { background: #ecf5ff; color: #409eff; }
        .group-opt-toggle {
            width: 18px;
            text-align: center;
            color: #999;
            cursor: pointer;
            flex-shrink: 0;
        }
        .group-opt-toggle.invisible { visibility: hidden; }
        .group-opt-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* 筛选区域 */
        .filter-section { margin-bottom: 20px; }
        .filter-row { display: flex; gap: 10px; flex-wrap: nowrap; align-items: flex-end; }
        .filter-item { flex: 1; min-width: 120px; max-width: 250px; position: relative; display: flex; align-items: center; gap: 6px; }
        .filter-item label { white-space: nowrap; flex-shrink: 0; }
        .filter-item input, .filter-item select, .filter-item .date-range-input { flex: 1; min-width: 0; }
        .filter-item .date-range-input { width: auto; }
        .filter-item input, .filter-item select {
            height: 32px;
            padding: 0 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
        }
        .filter-item input { padding-right: 28px; }
        .filter-buttons { display: flex; gap: 10px; align-items: center; }
        .filter-clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            display: none;
        }
        .filter-clear-btn.show { display: block; }
        
        /* 表格 - 极简风格 */
        .table-container { max-height: 400px; overflow-y: auto; border: 1px solid #e0e0e0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e0e0e0; font-size: 13px; }
        th {
            background: #f5f7fa;
            color: #333;
            font-weight: 500;
            position: sticky;
            top: 0;
        }
        tr:hover { background: #fafafa; }
        .badge { padding: 2px 8px; border-radius: 3px; font-size: 12px; }
        .badge-success { background: #f0f9eb; color: #67c23a; }
        .badge-warning { background: #fdf6ec; color: #e6a23c; }
        .badge-info { background: #ecf5ff; color: #409eff; }
        .badge-primary { background: #ecf5ff; color: #409eff; }
        .action-btns { display: flex; gap: 5px; }
        
        /* 分页 - 极简风格 */
        .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0; }
        .pagination-controls { display: flex; gap: 8px; align-items: center; }
        .pagination-info { color: #666; font-size: 13px; }
        .page-size-select { padding: 4px 8px; border: 1px solid #dcdfe6; border-radius: 3px; font-size: 13px; }
        
        /* 模态框 - 极简风格 */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content {
            background: white;
            padding: 20px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        .modal-header h3 { color: #333; font-size: 16px; }
        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }
        .close-btn:hover { color: #333; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; padding-top: 10px; border-top: 1px solid #e0e0e0; }
        
        /* Toast - 极简风格 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #409eff;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            z-index: 3000;
            display: none;
            font-size: 13px;
        }
        .toast.show { display: block; }
        
        /* Tab内容 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* 日期选择器 */
        .date-range-input {
            width: 100%;
            height: 32px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            background: white;
            box-sizing: border-box;
        }
        .date-range-input:hover { border-color: #409eff; }
        
        /* 日期选择器弹窗 */
        .date-picker-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 2000;
        }
        .date-picker-modal.show { display: block; }
        .date-picker-container {
            position: absolute;
            background: white;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        .date-picker-panels { display: flex; gap: 20px; }
        .date-picker-panel { flex: 1; min-width: 224px; }
        .date-picker-panel-title { font-size: 12px; color: #999; margin-bottom: 6px; }
        .date-picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .date-picker-header button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
        }
        .date-picker-header button:hover { color: #409eff; }
        .date-picker-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .date-picker-day {
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
        }
        .date-picker-day.other-month { color: #ccc; }
        .date-picker-day.today { background: #f0f9ff; color: #409eff; }
        .date-picker-day:hover { background: #f0f9ff; }
        .date-picker-day.selected { background: #409eff; color: white; }
        .date-picker-day.in-range { background: #ecf5ff; }
        .date-picker-week {
            padding: 8px;
            text-align: center;
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }
        .date-picker-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }
        
        /* 响应列表 - 极简风格 */
        .response-list { margin-top: 10px; }
        .response-item {
            background: #f5f7fa;
            border: 1px solid #e0e0e0;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .response-item.active { border-color: #409eff; background: #ecf5ff; }
        .response-info h4 { color: #333; margin-bottom: 3px; font-size: 13px; }
        .response-info p { color: #666; font-size: 12px; }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c0c4cc; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #909399; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Mock Server</h2>
            </div>
            <div class="tree-container" id="treeContainer">
                <!-- 目录树会动态渲染在这里 -->
            </div>
        </div>
        
        <!-- 右侧主内容区 -->
        <div class="main-content">
            <!-- Tab导航 -->
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('configs')">
                    Mock配置
                </button>
                <button class="tab-btn" onclick="switchTab('logs')">
                    请求日志
                </button>
            </div>
            
            <!-- Mock配置Tab -->
            <div class="tab-content active" id="configsTab">
                <div class="card">
                    <div class="card-header">
                        <h2 id="currentGroupTitle">全部配置</h2>
                        <button class="btn btn-success" onclick="openAddConfigModal()">
                            添加配置
                        </button>
                    </div>
                    
                    <!-- 筛选区域 -->
                    <div class="filter-section">
                        <div class="filter-row">
                            <div class="filter-item">
                                <label>名称</label>
                                <input type="text" id="filterName" placeholder="搜索名称">
                                <button class="filter-clear-btn" onclick="clearFilter('filterName')">×</button>
                            </div>
                            <div class="filter-item">
                                <label>方法</label>
                                <select id="filterMethod">
                                    <option value="">全部</option>
                                    <option value="GET">GET</option>
                                    <option value="POST">POST</option>
                                    <option value="PUT">PUT</option>
                                    <option value="DELETE">DELETE</option>
                                    <option value="PATCH">PATCH</option>
                                </select>
                            </div>
                            <div class="filter-item">
                                <label>URL</label>
                                <input type="text" id="filterUrl" placeholder="搜索URL">
                                <button class="filter-clear-btn" onclick="clearFilter('filterUrl')">×</button>
                            </div>
                            <div class="filter-item">
                                <label>创建时间</label>
                                <div class="date-range-input" id="configDateRange" onclick="openDatePicker('config', event)">
                                    <span id="configDateRangeText">选择日期范围</span>
                                </div>
                            </div>
                            <div class="filter-buttons">
                                <button class="btn btn-secondary" onclick="resetFilters()">重置</button>
                                <button class="btn btn-primary" onclick="applyFilters()">筛选</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 配置列表 -->
                    <div class="table-container">
                        <table id="configTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>名称</th>
                                    <th>方法</th>
                                    <th>URL模式</th>
                                    <th>创建日期</th>
                                    <th>响应数</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="configList"></tbody>
                        </table>
                    </div>
                    
                    <!-- 分页 -->
                    <div class="pagination" id="configPagination"></div>
                </div>
            </div>
            
            <!-- 日志Tab -->
            <div class="tab-content" id="logsTab">
                <div class="card">
                    <div class="card-header">
                        <h2>📋 请求日志</h2>
                    </div>
                    
                    <!-- 日志筛选 -->
                    <div class="filter-section">
                        <div class="filter-row">
                            <div class="filter-item">
                                <label>请求URL</label>
                                <input type="text" id="filterLogUrl" placeholder="搜索请求URL">
                                <button class="filter-clear-btn" onclick="clearFilter('filterLogUrl')">×</button>
                            </div>
                            <div class="filter-item">
                                <label>Mock URL</label>
                                <input type="text" id="filterLogMockUrl" placeholder="搜索Mock URL">
                                <button class="filter-clear-btn" onclick="clearFilter('filterLogMockUrl')">×</button>
                            </div>
                            <div class="filter-item">
                                <label>时间范围</label>
                                <div class="date-range-input" id="logDateRange" onclick="openDatePicker('log', event)">
                                    <span id="logDateRangeText">选择日期范围</span>
                                </div>
                            </div>
                            <div class="filter-buttons">
                                <button class="btn btn-secondary" onclick="resetLogFilters()">重置</button>
                                <button class="btn btn-primary" onclick="applyLogFilters()">筛选</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 日志列表 -->
                    <div class="table-container">
                        <table id="logTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>方法</th>
                                    <th>URL</th>
                                    <th>Mock URL</th>
                                    <th>状态码</th>
                                    <th>时间</th>
                                </tr>
                            </thead>
                            <tbody id="logList"></tbody>
                        </table>
                    </div>
                    
                    <!-- 分页 -->
                    <div class="pagination" id="logPagination"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加配置弹窗 -->
    <div class="modal" id="addConfigModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>➕ 添加Mock配置</h3>
                <button class="close-btn" onclick="closeAddConfigModal()">&times;</button>
            </div>
            
            <form id="addConfigForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>配置名称<span class="required">*</span></label>
                        <input type="text" id="addName" required>
                    </div>
                    <div class="form-group">
                        <label>所属目录</label>
                        <div class="group-select">
                            <input type="hidden" id="addGroupId" value="0">
                            <div class="group-select-display" onclick="toggleGroupDropdown('add')">
                                <span id="addGroupDisplay">📁 根目录</span>
                                <span class="group-select-arrow">▾</span>
                            </div>
                            <div class="group-select-dropdown" id="addGroupDropdown"></div>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>HTTP方法<span class="required">*</span></label>
                        <select id="addMethod" required>
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="DELETE">DELETE</option>
                            <option value="PATCH">PATCH</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>URL匹配类型</label>
                        <select id="addUrlMatchType">
                            <option value="exact">精确匹配</option>
                            <option value="prefix">前缀匹配</option>
                            <option value="regex">正则匹配</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>URL模式<span class="required">*</span></label>
                    <input type="text" id="addUrlPattern" required placeholder="/api/user/123">
                </div>
                
                <div class="form-group">
                    <label>响应列表</label>
                    <div class="response-list" id="addResponseList"></div>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="openAddResponseModal('add')">
                        ➕ 添加响应
                    </button>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeAddConfigModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 编辑配置弹窗 -->
    <div class="modal" id="editConfigModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ 编辑Mock配置</h3>
                <button class="close-btn" onclick="closeEditConfigModal()">&times;</button>
            </div>
            
            <form id="editConfigForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>配置名称<span class="required">*</span></label>
                        <input type="text" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label>所属目录</label>
                        <div class="group-select">
                            <input type="hidden" id="editGroupId" value="0">
                            <div class="group-select-display" onclick="toggleGroupDropdown('edit')">
                                <span id="editGroupDisplay">📁 根目录</span>
                                <span class="group-select-arrow">▾</span>
                            </div>
                            <div class="group-select-dropdown" id="editGroupDropdown"></div>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>HTTP方法<span class="required">*</span></label>
                        <select id="editMethod" required>
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="DELETE">DELETE</option>
                            <option value="PATCH">PATCH</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>URL匹配类型</label>
                        <select id="editUrlMatchType">
                            <option value="exact">精确匹配</option>
                            <option value="prefix">前缀匹配</option>
                            <option value="regex">正则匹配</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>URL模式<span class="required">*</span></label>
                    <input type="text" id="editUrlPattern" required>
                </div>
                
                <div class="form-group">
                    <label>响应列表</label>
                    <div class="response-list" id="editResponseList"></div>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="openAddResponseModal('edit')">
                        ➕ 添加响应
                    </button>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeEditConfigModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 添加/编辑响应弹窗 -->
    <div class="modal" id="responseModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="responseModalTitle">➕ 添加响应</h3>
                <button class="close-btn" onclick="closeResponseModal()">&times;</button>
            </div>
            
            <form id="responseForm">
                <div class="form-group">
                    <label>响应名称<span class="required">*</span></label>
                    <input type="text" id="responseName" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>状态码<span class="required">*</span></label>
                        <input type="number" id="responseStatus" value="200" required>
                    </div>
                    <div class="form-group">
                        <label>延迟(毫秒)</label>
                        <input type="number" id="responseDelay" value="0">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>响应头(JSON)</label>
                    <textarea id="responseHeaders" placeholder='{"Content-Type": "application/json"}'></textarea>
                </div>
                
                <div class="form-group">
                    <label>响应体<span class="required">*</span></label>
                    <textarea id="responseBody" required placeholder='{"code": 200, "message": "success"}'></textarea>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeResponseModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 新建/编辑目录弹窗 -->
    <div class="modal" id="groupModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="groupModalTitle">📁 新建目录</h3>
                <button class="close-btn" onclick="closeGroupModal()">&times;</button>
            </div>
            
            <form id="groupForm">
                <input type="hidden" id="groupParentId" value="0">
                <input type="hidden" id="groupEditId" value="">
                
                <div class="form-group">
                    <label>目录名称<span class="required">*</span></label>
                    <input type="text" id="groupName" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>图标</label>
                        <select id="groupIcon">
                            <option value="📁">📁 文件夹</option>
                            <option value="👤">👤 用户</option>
                            <option value="📦">📦 商品</option>
                            <option value="📋">📋 订单</option>
                            <option value="💰">💰 支付</option>
                            <option value="🔍">🔍 搜索</option>
                            <option value="⚡">⚡ 接口</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>颜色</label>
                        <input type="color" id="groupColor" value="#667eea">
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeGroupModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>
    
    <!-- 日期选择器弹窗 -->
    <div class="date-picker-modal" id="datePickerModal" onclick="if(event.target===this)closeDatePicker()">
        <div class="date-picker-container">
            <div class="date-picker-panels">
                <div class="date-picker-panel">
                    <div class="date-picker-panel-title">开始日期</div>
                    <div class="date-picker-header">
                        <button onclick="datePickerPrevMonth('start')">&#8249;</button>
                        <span id="datePickerStartTitle">2024年10月</span>
                        <button onclick="datePickerNextMonth('start')">&#8250;</button>
                    </div>
                    <div class="date-picker-grid" id="datePickerStartGrid"></div>
                </div>
                <div class="date-picker-panel">
                    <div class="date-picker-panel-title">结束日期</div>
                    <div class="date-picker-header">
                        <button onclick="datePickerPrevMonth('end')">&#8249;</button>
                        <span id="datePickerEndTitle">2024年11月</span>
                        <button onclick="datePickerNextMonth('end')">&#8250;</button>
                    </div>
                    <div class="date-picker-grid" id="datePickerEndGrid"></div>
                </div>
            </div>
            <div class="date-picker-footer">
                <button class="btn btn-secondary" onclick="closeDatePicker()">取消</button>
                <button class="btn btn-primary" onclick="confirmDatePicker()">确定</button>
            </div>
        </div>
    </div>
    
    <script>
        // ==================== 日期选择器全局变量 ====================
        let datePickerMode = 'config'; // config或log
        let datePickerStartYear = 2024;
        let datePickerStartMonth = 10;
        let datePickerEndYear = 2024;
        let datePickerEndMonth = 11;
        let datePickerStart = null;
        let datePickerEnd = null;
        
        // ==================== 全局变量 ====================
        let currentTab = 'configs';
        let currentGroupId = 0;
        let groups = [];
        let groupTree = []; // 目录树形结构
        let groupDropdownExpanded = {}; // 下拉框展开状态
        let tempResponses = [];
        let currentEditConfigId = null;
        let responseMode = 'add'; // add或edit
        
        let configPage = 1;
        let configPageSize = 10;
        let logPage = 1;
        let logPageSize = 10;
        
        let filters = {
            name: '',
            method: '',
            url: '',
            date_start: '',
            date_end: ''
        };
        
        let logFilters = {
            url: '',
            mock_url: '',
            date_start: '',
            date_end: ''
        };
        
        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            loadGroups();
            loadConfigs();
            setupEventListeners();
        });
        
        function setupEventListeners() {
            // 表单提交
            document.getElementById('addConfigForm').addEventListener('submit', handleAddConfig);
            document.getElementById('editConfigForm').addEventListener('submit', handleEditConfig);
            document.getElementById('responseForm').addEventListener('submit', handleSaveResponse);
            document.getElementById('groupForm').addEventListener('submit', handleSaveGroup);
            
            // 输入变化时显示清空按钮
            ['filterName', 'filterUrl', 'filterLogUrl', 'filterLogMockUrl'].forEach(id => {
                const input = document.getElementById(id);
                if (input) {
                    input.addEventListener('input', updateFilterClearBtn);
                }
            });
            
            // 日期输入监听
            document.getElementById('filterDateStart').addEventListener('change', function() {
                filters.date_start = this.value;
                updateFilterClearBtn();
            });
            document.getElementById('filterDateEnd').addEventListener('change', function() {
                filters.date_end = this.value;
                updateFilterClearBtn();
            });
            document.getElementById('filterLogDateStart').addEventListener('change', function() {
                logFilters.date_start = this.value;
                updateFilterClearBtn();
            });
            document.getElementById('filterLogDateEnd').addEventListener('change', function() {
                logFilters.date_end = this.value;
                updateFilterClearBtn();
            });
        }
        
        // ==================== Tab切换 ====================
        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.closest('.tab-btn').classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            if (tabName === 'logs') {
                loadLogs();
            }
        }
        
        // ==================== 目录树 ====================
        async function loadGroups() {
            try {
                const response = await fetch('/_api/groups');
                groups = await response.json();
                renderTree();
                populateGroupSelects();
            } catch (e) {
                console.error("加载目录失败:", e);
                showToast('加载目录失败');
            }
        }
        
        let treeExpandedState = {}; // 记录每个目录的展开状态
        
        function renderTree() {
            const container = document.getElementById('treeContainer');
            
            // 根节点
            let html = `
                <div class="tree-item ${currentGroupId === 0 ? 'active' : ''}" onclick="selectGroup(0)" style="padding-left: 8px;">
                    <span class="tree-expand invisible"></span>
                    <span class="name">全部配置</span>
                    <span class="tree-menu" onclick="event.stopPropagation(); showTreeMenu(event, 0)">⋮</span>
                </div>
            `;
            
            // 先把 groups 处理成 children 结构
            function buildTree(flatItems) {
                const map = {};
                const roots = [];
                flatItems.forEach(i => {
                    map[i.id] = { ...i, children: [] };
                });
                flatItems.forEach(i => {
                    if (i.parent_id === 0) {
                        roots.push(map[i.id]);
                    } else if (map[i.parent_id]) {
                        map[i.parent_id].children.push(map[i.id]);
                    }
                });
                return roots;
            }
            
            const treeData = buildTree(groups);
            html += renderTreeItems(treeData, 0);
            container.innerHTML = html;
        }
        
        function renderTreeItems(items, level) {
            let html = '';
            for (let g of items) {
                const hasKids = g.children && g.children.length > 0;
                const isExpanded = treeExpandedState[g.id] === true;
                
                html += `
                    <div class="tree-item ${currentGroupId === g.id ? 'active' : ''}" onclick="selectGroup(${g.id})" style="padding-left: ${8 + level * 12}px;">
                        <span class="tree-expand ${hasKids ? '' : 'invisible'}" onclick="event.stopPropagation(); toggleExpand(${g.id})">${isExpanded ? '▼' : '▶'}</span>
                        <span class="name">${g.name}</span>
                        <span class="tree-menu" onclick="event.stopPropagation(); showTreeMenu(event, ${g.id})">⋮</span>
                    </div>
                `;
                
                if (hasKids) {
                    html += `<div class="tree-children" style="display: ${isExpanded ? 'block' : 'none'};">${renderTreeItems(g.children, level + 1)}</div>`;
                }
            }
            return html;
        }
        
        function toggleExpand(groupId) {
            treeExpandedState[groupId] = !treeExpandedState[groupId];
            renderTree();
        }
        
        function selectGroup(groupId) {
            currentGroupId = groupId;
            configPage = 1;
            renderTree();
            updateGroupTitle();
            loadConfigs();
        }
        
        function updateGroupTitle() {
            const title = document.getElementById('currentGroupTitle');
            if (currentGroupId === 0) {
                title.textContent = '全部配置';
            } else {
                const group = findGroup(groups, currentGroupId);
                title.textContent = `${group ? group.name : '未知目录'}`;
            }
        }
        
        // 三点菜单
        let currentMenuGroupId = null;
        
        function showTreeMenu(event, groupId) {
            event.stopPropagation();
            
            // 关闭其他菜单
            document.querySelectorAll('.tree-menu-dropdown').forEach(m => m.remove());
            
            currentMenuGroupId = groupId;
            
            // 创建菜单
            const menu = document.createElement('div');
            menu.className = 'tree-menu-dropdown show';
            menu.innerHTML = `
                <div class="tree-menu-item" onclick="openAddGroupModal(${groupId}); hideTreeMenu();">添加子目录</div>
                <div class="tree-menu-item" onclick="openEditGroupModal(${groupId}); hideTreeMenu();">编辑</div>
                <div class="tree-menu-item" onclick="deleteGroup(${groupId}); hideTreeMenu();">删除</div>
            `;
            
            // 定位
            const menuBtn = event.target;
            const rect = menuBtn.getBoundingClientRect();
            const sidebar = document.querySelector('.sidebar');
            const sidebarRect = sidebar.getBoundingClientRect();
            
            menu.style.position = 'fixed';
            menu.style.left = (rect.left - 80) + 'px';
            menu.style.top = (rect.bottom + 2) + 'px';
            
            document.body.appendChild(menu);
            
            // 点击其他地方关闭菜单
            setTimeout(() => {
                document.addEventListener('click', hideTreeMenu);
            }, 0);
        }
        
        function hideTreeMenu() {
            document.querySelectorAll('.tree-menu-dropdown').forEach(m => m.remove());
            document.removeEventListener('click', hideTreeMenu);
            currentMenuGroupId = null;
        }
        
        function findGroup(items, id) {
            for (let item of items) {
                if (item.id === id) return item;
            }
            return null;
        }
        
        function flattenTree(tree) {
            let result = [];
            for (let node of tree) {
                result.push(node);
                if (node.children && node.children.length > 0) {
                    result = result.concat(flattenTree(node.children));
                }
            }
            return result;
        }

        function populateGroupSelects() {
            // 构建目录树
            const map = {};
            const roots = [];
            groups.forEach(i => { map[i.id] = { ...i, children: [] }; });
            groups.forEach(i => {
                if (i.parent_id === 0) {
                    roots.push(map[i.id]);
                } else if (map[i.parent_id]) {
                    map[i.parent_id].children.push(map[i.id]);
                }
            });
            groupTree = roots;
            
            updateGroupDisplay('add');
            updateGroupDisplay('edit');
            closeAllGroupDropdowns();
        }
        
        function toggleGroupDropdown(kind) {
            const dropdown = document.getElementById(kind + 'GroupDropdown');
            if (!dropdown) return;
            const isOpen = dropdown.classList.contains('show');
            closeAllGroupDropdowns();
            if (!isOpen) {
                renderGroupDropdown(kind);
                dropdown.classList.add('show');
            }
        }
        
        function closeGroupDropdown(kind) {
            const dropdown = document.getElementById(kind + 'GroupDropdown');
            if (dropdown) dropdown.classList.remove('show');
        }
        
        function closeAllGroupDropdowns() {
            closeGroupDropdown('add');
            closeGroupDropdown('edit');
        }
        
        function renderGroupDropdown(kind) {
            const dropdown = document.getElementById(kind + 'GroupDropdown');
            if (!dropdown) return;
            const currentValue = parseInt(document.getElementById(kind + 'GroupId').value) || 0;
            let html = '';
            html += `<div class="group-opt-row ${currentValue === 0 ? 'selected' : ''}">
                <span class="group-opt-toggle invisible">▸</span>
                <span class="group-opt-label" onclick="selectGroupOption(0, '${kind}')">📁 根目录</span>
            </div>`;
            html += buildGroupOptionsHtml(groupTree, 0, kind, currentValue);
            dropdown.innerHTML = html;
        }
        
        function buildGroupOptionsHtml(items, level, kind, currentValue) {
            let html = '';
            for (let g of items) {
                const hasKids = g.children && g.children.length > 0;
                const isExpanded = groupDropdownExpanded[g.id] === true;
                html += `<div class="group-opt-row ${currentValue === g.id ? 'selected' : ''}" style="padding-left: ${8 + level * 16}px;">
                    <span class="group-opt-toggle ${hasKids ? '' : 'invisible'}" onclick="event.stopPropagation(); toggleGroupNode(${g.id}, '${kind}')">${isExpanded ? '▾' : '▸'}</span>
                    <span class="group-opt-label" onclick="selectGroupOption(${g.id}, '${kind}')">📁 ${g.name}</span>
                </div>`;
                if (hasKids && isExpanded) {
                    html += buildGroupOptionsHtml(g.children, level + 1, kind, currentValue);
                }
            }
            return html;
        }
        
        function toggleGroupNode(groupId, kind) {
            groupDropdownExpanded[groupId] = !groupDropdownExpanded[groupId];
            renderGroupDropdown(kind);
        }
        
        function selectGroupOption(value, kind) {
            document.getElementById(kind + 'GroupId').value = value;
            updateGroupDisplay(kind);
            closeAllGroupDropdowns();
        }
        
        function setGroupSelectValue(kind, value) {
            document.getElementById(kind + 'GroupId').value = value;
            updateGroupDisplay(kind);
        }
        
        function updateGroupDisplay(kind) {
            const input = document.getElementById(kind + 'GroupId');
            const display = document.getElementById(kind + 'GroupDisplay');
            if (!input || !display) return;
            const value = parseInt(input.value) || 0;
            if (value === 0) {
                display.textContent = '📁 根目录';
                return;
            }
            const group = findGroup(groups, value);
            display.textContent = group ? ('📁 ' + group.name) : ('📁 #' + value);
        }
        
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.group-select')) {
                closeAllGroupDropdowns();
            }
        });
        
        // ==================== 配置列表 ====================
        async function loadConfigs() {
            try {
                let url = `/_api/groups/${currentGroupId}/configs?page=${configPage}&page_size=${configPageSize}`;
                
                if (filters.name) url += `&name=${encodeURIComponent(filters.name)}`;
                if (filters.method) url += `&method=${encodeURIComponent(filters.method)}`;
                if (filters.url) url += `&url=${encodeURIComponent(filters.url)}`;
                if (filters.date_start) url += `&date_start=${filters.date_start}`;
                if (filters.date_end) url += `&date_end=${filters.date_end}`;
                
                const response = await fetch(url);
                const data = await response.json();
                renderConfigList(data.items);
                renderPagination('config', data);
            } catch (e) {
                console.error(e);
                showToast('加载配置失败');
            }
        }
        
        function renderConfigList(configs) {
            const tbody = document.getElementById('configList');
            if (!configs || configs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: #999;">暂无配置</td></tr>';
                return;
            }
            
            tbody.innerHTML = configs.map(config => {
                // 处理响应数量
                const responseCount = (config.responses || []).length;
                return `
                <tr>
                    <td>${config.id}</td>
                    <td>${config.name}</td>
                    <td><span class="badge badge-primary">${config.method}</span></td>
                    <td><code>${config.url_pattern}</code></td>
                    <td>${config.created_at ? config.created_at.split('T')[0] : '-'}</td>
                    <td>${responseCount} 个</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn btn-primary btn-sm" onclick="openEditConfigModal(${config.id})">编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteConfig(${config.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }
        
        function renderPagination(type, data) {
            const containerId = type === 'config' ? 'configPagination' : 'logPagination';
            const container = document.getElementById(containerId);
            const page = data.page;
            const totalPages = data.total_pages;
            
            container.innerHTML = `
                <div class="pagination-info">共 ${data.total} 条，第 ${page}/${totalPages} 页</div>
                <div class="pagination-controls">
                    <select class="page-size-select" onchange="changePageSize('${type}', this.value)">
                        <option value="10" ${data.page_size === 10 ? 'selected' : ''}>10条/页</option>
                        <option value="20" ${data.page_size === 20 ? 'selected' : ''}>20条/页</option>
                        <option value="50" ${data.page_size === 50 ? 'selected' : ''}>50条/页</option>
                    </select>
                    <button class="btn btn-secondary btn-sm" onclick="goToPage('${type}', ${page - 1})" ${page <= 1 ? 'disabled' : ''}>上一页</button>
                    <span style="color: #666;">${page} / ${totalPages}</span>
                    <button class="btn btn-secondary btn-sm" onclick="goToPage('${type}', ${page + 1})" ${page >= totalPages ? 'disabled' : ''}>下一页</button>
                </div>
            `;
        }
        
        function goToPage(type, pageNum) {
            if (type === 'config') {
                configPage = pageNum;
                loadConfigs();
            } else {
                logPage = pageNum;
                loadLogs();
            }
        }
        
        function changePageSize(type, size) {
            if (type === 'config') {
                configPageSize = parseInt(size);
                configPage = 1;
                loadConfigs();
            } else {
                logPageSize = parseInt(size);
                logPage = 1;
                loadLogs();
            }
        }
        
        // ==================== 配置CRUD ====================
        function openAddConfigModal() {
            document.getElementById('addConfigModal').classList.add('show');
            document.getElementById('addConfigForm').reset();
            tempResponses = [{
                name: '默认响应',
                responseStatus: 200,
                responseDelay: 0,
                responseHeaders: '{"Content-Type": "application/json"}',
                responseBody: '{"code": 200, "message": "success"}',
                isActive: true
            }];
            renderAddResponseList();
            populateGroupSelects();
            setGroupSelectValue('add', currentGroupId);
        }
        
        function closeAddConfigModal() {
            document.getElementById('addConfigModal').classList.remove('show');
        }
        
        async function handleAddConfig(e) {
            e.preventDefault();
            
            try {
                console.log("开始添加配置...");
                // 创建配置
                const configResponse = await fetch('/_api/configs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('addName').value,
                        group_id: parseInt(document.getElementById('addGroupId').value),
                        method: document.getElementById('addMethod').value,
                        url_pattern: document.getElementById('addUrlPattern').value,
                        url_match_type: document.getElementById('addUrlMatchType').value
                    })
                });
                
                const configData = await configResponse.json();
                const configId = configData.id;
                
                // 批量创建响应
                for (let i = 0; i < tempResponses.length; i++) {
                    const resp = tempResponses[i];
                    await fetch(`/_api/configs/${configId}/responses`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: resp.name,
                            response_status: resp.responseStatus,
                            response_delay: resp.responseDelay,
                            response_headers: resp.responseHeaders,
                            response_body: resp.responseBody,
                            is_active: resp.isActive == true ? 1 : 0
                        })
                    });
                }
                
                closeAddConfigModal();
                loadConfigs();
                showToast('保存成功');
            } catch (e) {
                console.error(e);
                showToast('保存失败');
            }
        }
        
        async function openEditConfigModal(configId) {
            currentEditConfigId = configId;
            try {
                const [configRes, responsesRes] = await Promise.all([
                    fetch(`/_api/configs/${configId}`),
                    fetch(`/_api/configs/${configId}/responses`)
                ]);
                
                const config = await configRes.json();
                const rawResponses = await responsesRes.json();
                
                // 转换字段：下划线 -> 驼峰
                tempResponses = rawResponses.map(resp => ({
                    id: resp.id, // 重要！必须保留！
                    name: resp.name,
                    responseStatus: resp.response_status,
                    responseHeaders: resp.response_headers,
                    responseBody: resp.response_body,
                    responseDelay: resp.response_delay,
                    isActive: resp.is_active == 1 || resp.is_active === true
                }));
                
                document.getElementById('editName').value = config.name;
                document.getElementById('editMethod').value = config.method;
                document.getElementById('editUrlPattern').value = config.url_pattern;
                document.getElementById('editUrlMatchType').value = config.url_match_type || 'exact';
                
                populateGroupSelects();
                setGroupSelectValue('edit', config.group_id || 0);
                
                renderEditResponseList();
                document.getElementById('editConfigModal').classList.add('show');
            } catch (e) {
                console.error(e);
                showToast('加载配置失败');
            }
        }
        
        function closeEditConfigModal() {
            document.getElementById('editConfigModal').classList.remove('show');
        }
        
        async function handleEditConfig(e) {
            e.preventDefault();
            
            try {
                console.log("开始保存配置...");
                // 更新配置
                await fetch(`/_api/configs/${currentEditConfigId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('editName').value,
                        group_id: parseInt(document.getElementById('editGroupId').value),
                        method: document.getElementById('editMethod').value,
                        url_pattern: document.getElementById('editUrlPattern').value,
                        url_match_type: document.getElementById('editUrlMatchType').value
                    })
                });
                
                // 获取现有的响应
                const oldResponses = await fetch(`/_api/configs/${currentEditConfigId}/responses`).then(r => r.json());
                
                // 创建一个映射：id -> resp
                const oldRespMap = {};
                for (let old of oldResponses) oldRespMap[old.id] = old;
                
                console.log("旧响应:", oldResponses);
                console.log("新响应:", tempResponses);
                
                let activeRespId = null;
                
                // 1. 处理所有 tempResponses
                for (let tempResp of tempResponses) {
                    const hasId = tempResp.id != null;
                    
                    if (hasId && oldRespMap[tempResp.id]) {
                        // 更新现有响应
                        console.log("更新响应", tempResp.id, tempResp);
                        await fetch(`/_api/responses/${tempResp.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: tempResp.name,
                                response_status: tempResp.responseStatus,
                                response_delay: tempResp.responseDelay,
                                response_headers: tempResp.responseHeaders,
                                response_body: tempResp.responseBody,
                                is_active: tempResp.isActive == true ? 1 : 0
                            })
                        });
                        // 从映射中删除，剩下的是要删除的
                        delete oldRespMap[tempResp.id];
                    } else {
                        // 创建新响应
                        console.log("创建新响应", tempResp);
                        const r = await fetch(`/_api/configs/${currentEditConfigId}/responses`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: tempResp.name,
                                response_status: tempResp.responseStatus,
                                response_delay: tempResp.responseDelay,
                                response_headers: tempResp.responseHeaders,
                                response_body: tempResp.responseBody,
                                is_active: tempResp.isActive == true ? 1 : 0
                            })
                        }).then(r => r.json());
                        if (tempResp.isActive) {
                            activeRespId = r.id;
                        }
                    }
                    
                    if (tempResp.isActive) {
                        activeRespId = tempResp.id;
                    }
                }
                
                // 2. 删除不再需要的响应
                for (let id in oldRespMap) {
                    console.log("删除响应", id);
                    await fetch(`/_api/responses/${id}`, { method: 'DELETE' });
                }
                
                // 3. 如果有激活的，设置激活
                if (activeRespId != null) {
                    console.log("设置激活响应", activeRespId);
                    await fetch(`/_api/responses/${activeRespId}/active`, { 
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 'is_active': true })
                    });
                }
                
                closeEditConfigModal();
                loadConfigs();
                showToast('保存成功');
            } catch (e) {
                console.error(e);
                showToast('保存失败');
            }
        }
        
        async function deleteConfig(configId) {
            if (!confirm('确定要删除这个配置吗？')) return;
            try {
                await fetch(`/_api/configs/${configId}`, { method: 'DELETE' });
                loadConfigs();
                showToast('删除成功');
            } catch (e) {
                console.error(e);
                showToast('删除失败');
            }
        }

        // ==================== 响应管理 ====================
        function renderAddResponseList() {
            renderResponseList('addResponseList');
        }
        
        function renderEditResponseList() {
            renderResponseList('editResponseList');
        }
        
        function renderResponseList(containerId) {
            const container = document.getElementById(containerId);
            if (!tempResponses || tempResponses.length === 0) {
                container.innerHTML = '<div style="color: #999; padding: 10px;">暂无响应</div>';
                return;
            }
            
            container.innerHTML = tempResponses.map((resp, index) => `
                <div class="response-item ${resp.isActive ? 'active' : ''}">
                    <div class="response-info">
                        <h4>${resp.name} ${resp.isActive ? '<span class="badge badge-success">已激活</span>' : ''}</h4>
                        <p>状态码: ${resp.responseStatus} | 延迟: ${resp.responseDelay}ms</p>
                    </div>
                    <div class="action-btns">
                        <button type="button" class="btn btn-sm btn-primary" onclick="toggleResponseActive(${index})">${resp.isActive ? '取消激活' : '激活'}</button>
                        <button type="button" class="btn btn-sm btn-secondary" onclick="editResponse(${index})">编辑</button>
                        <button type="button" class="btn btn-sm btn-danger" onclick="deleteResponse(${index})">删除</button>
                    </div>
                </div>
            `).join('');
        }
        
        function openAddResponseModal(mode) {
            responseMode = mode;
            document.getElementById('responseModalTitle').textContent = '➕ 添加响应';
            document.getElementById('responseForm').reset();
            document.getElementById('responseHeaders').value = '{"Content-Type": "application/json"}';
            document.getElementById('responseBody').value = '{"code": 200, "message": "success"}';
            document.getElementById('responseStatus').value = 200;
            document.getElementById('responseDelay').value = 0;
            document.getElementById('responseName').value = '响应' + (tempResponses.length + 1);
            document.getElementById('responseModal').classList.add('show');
        }
        
        let editingResponseIndex = -1;
        function editResponse(index) {
            const resp = tempResponses[index];
            editingResponseIndex = index;
            responseMode = 'edit_' + index;
            document.getElementById('responseModalTitle').textContent = '✏️ 编辑响应';
            document.getElementById('responseName').value = resp.name;
            document.getElementById('responseStatus').value = resp.responseStatus;
            document.getElementById('responseDelay').value = resp.responseDelay;
            document.getElementById('responseHeaders').value = resp.responseHeaders || '';
            document.getElementById('responseBody').value = resp.responseBody || '';
            document.getElementById('responseModal').classList.add('show');
        }
        
        function closeResponseModal() {
            document.getElementById('responseModal').classList.remove('show');
        }
        
        function handleSaveResponse(e) {
            e.preventDefault();
            e.stopPropagation(); // 防止事件冒泡
            
            const resp = {
                name: document.getElementById('responseName').value,
                responseStatus: parseInt(document.getElementById('responseStatus').value),
                responseDelay: parseInt(document.getElementById('responseDelay').value),
                responseHeaders: document.getElementById('responseHeaders').value,
                responseBody: document.getElementById('responseBody').value,
                isActive: false
            };
            
            if (responseMode.startsWith('edit_')) {
                const index = parseInt(responseMode.split('_')[1]);
                // 保留原有id！
                if (tempResponses[index].id !== undefined) {
                    resp.id = tempResponses[index].id;
                }
                resp.isActive = tempResponses[index].isActive;
                tempResponses[index] = resp;
            } else {
                if (tempResponses.length === 0) {
                    resp.isActive = true;
                }
                tempResponses.push(resp);
            }
            
            closeResponseModal();
            if (responseMode === 'add' || responseMode.startsWith('edit_')) {
                if (currentEditConfigId) {
                    renderEditResponseList();
                } else {
                    renderAddResponseList();
                }
            }
            showToast('保存成功');
        }
        
        function deleteResponse(index) {
            tempResponses.splice(index, 1);
            if (currentEditConfigId) {
                renderEditResponseList();
            } else {
                renderAddResponseList();
            }
        }
        
        function toggleResponseActive(index) {
            tempResponses.forEach((resp, i) => {
                resp.isActive = i === index;
            });
            if (currentEditConfigId) {
                renderEditResponseList();
            } else {
                renderAddResponseList();
            }
        }
        
        // ==================== 日志 ====================
        async function loadLogs() {
            try {
                let url = `/_api/logs?page=${logPage}&page_size=${logPageSize}`;
                
                if (logFilters.url) url += `&url=${encodeURIComponent(logFilters.url)}`;
                if (logFilters.mock_url) url += `&mock_url=${encodeURIComponent(logFilters.mock_url)}`;
                if (logFilters.date_start) url += `&date_start=${logFilters.date_start}`;
                if (logFilters.date_end) url += `&date_end=${logFilters.date_end}`;
                
                const response = await fetch(url);
                const data = await response.json();
                renderLogList(data.items);
                renderPagination('log', data);
            } catch (e) {
                console.error(e);
                showToast('加载日志失败');
            }
        }
        
        function renderLogList(logs) {
            const tbody = document.getElementById('logList');
            if (!logs || logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #999;">暂无日志</td></tr>';
                return;
            }
            
            tbody.innerHTML = logs.map(log => `
                <tr>
                    <td>${log.id}</td>
                    <td><span class="badge badge-primary">${log.request_method}</span></td>
                    <td><code>${log.request_url}</code></td>
                    <td>${log.matched_config_url || '-'}</td>
                    <td><span class="badge ${log.response_status && log.response_status >= 200 && log.response_status < 300 ? 'badge-success' : 'badge-warning'}">${log.response_status || '-'}</span></td>
                    <td>${log.created_at ? log.created_at.replace('T', ' ').split('.')[0] : '-'}</td>
                </tr>
            `).join('');
        }
        
        // ==================== 筛选 ====================
        function applyFilters() {
            filters.name = document.getElementById('filterName').value;
            filters.method = document.getElementById('filterMethod').value;
            filters.url = document.getElementById('filterUrl').value;

            loadConfigs();

        function resetFilters() {
            document.getElementById('filterName').value = '';
            document.getElementById('filterMethod').value = '';
            document.getElementById('filterUrl').value = '';
            document.getElementById('filterDateStart').value = '';
            document.getElementById('filterDateEnd').value = '';
            filters = { name: '', method: '', url: '', date_start: '', date_end: '' };
            updateFilterClearBtn();
            configPage = 1;
            loadConfigs();
